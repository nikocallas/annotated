<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Annotated</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="3" y="3" width="26" height="26" rx="6" fill="#01696F" />
          <path d="M10 22L13 10H15.5L18.5 22M11.5 18H17" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <circle cx="22.5" cy="22" r="2" fill="#fff" />
        </svg>
        <span class="brand-name">annotated</span>
      </div>
      <nav class="tabs">
        <button class="tab active" data-tab="clip">Clip</button>
        <button class="tab" data-tab="feed">Feed</button>
        <button class="tab" data-tab="profile">Profile</button>
      </nav>
    </header>

    <main id="content"></main>

    <template id="login-view">
      <section class="view view-login">
        <div class="hero">
          <h2 class="serif">Sign in to start clipping</h2>
          <p class="muted">
            Annotated uses X or Google to sign you in. No email, no password.
          </p>
        </div>
        <div class="auth-buttons">
          <button class="btn btn-primary" data-provider="x">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M18.244 2H21l-6.523 7.45L22 22h-6.828l-4.74-6.184L4.8 22H2.043l6.978-7.97L2 2h6.914l4.286 5.668L18.244 2z"/></svg>
            Continue with X
          </button>
          <button class="btn btn-outline" data-provider="google">
            <svg viewBox="0 0 24 24" width="14" height="14"><path fill="#FFC107" d="M21.8 10H12v4h5.65A6 6 0 1 1 12 6c1.5 0 2.86.55 3.92 1.46l2.83-2.83A10 10 0 1 0 22 12c0-.67-.07-1.35-.2-2z"/></svg>
            Continue with Google
          </button>
        </div>
        <p class="hint">
          Production OAuth credentials aren't connected in this build, so the
          buttons sign you into the demo identity. The flow is wired the way the
          spec describes — X via OAuth 2.0 PKCE, Google via the Identity API.
        </p>
      </section>
    </template>

    <template id="clip-view">
      <section class="view">
        <div class="page-card">
          <div class="page-card-meta">
            <span class="badge" data-badge>Detecting…</span>
            <span class="muted small" data-host></span>
          </div>
          <div class="page-card-title" data-title>—</div>
          <div class="page-card-author muted small" data-author></div>
          <a class="source-link" data-source-link target="_blank" rel="noopener noreferrer">View source ↗</a>
        </div>

        <div class="clip-section" data-clip-section>
          <!-- Clip-type-specific UI injected here -->
        </div>

        <div class="commentary-section">
          <label class="label">Your commentary</label>
          <textarea data-commentary placeholder="Why does this matter?" rows="3"></textarea>
          <div class="audio-recorder">
            <button class="btn btn-ghost" data-record-toggle>
              <span class="dot" data-record-dot></span>
              <span data-record-label>Record audio</span>
            </button>
            <span data-record-time class="muted small mono"></span>
          </div>
          <audio data-audio-preview controls hidden></audio>
        </div>

        <div class="actions">
          <button class="btn btn-primary btn-lg" data-publish>Publish annotation</button>
        </div>
        <p class="hint" data-error hidden></p>
        <p class="hint">
          <strong>Required by spec:</strong> clips capped at 90s. YouTube
          downscaled to 240p server-side. Source URL is always linked.
        </p>
      </section>
    </template>

    <template id="feed-view">
      <section class="view">
        <h3 class="section-title">Recent annotations</h3>
        <div class="feed" data-feed>
          <div class="muted small">Loading…</div>
        </div>
      </section>
    </template>

    <template id="profile-view">
      <section class="view">
        <div class="profile-header">
          <img class="avatar lg" data-avatar />
          <div>
            <div class="profile-name" data-display-name></div>
            <div class="muted small" data-username></div>
          </div>
        </div>
        <p class="bio" data-bio></p>
        <div class="profile-stats">
          <div><strong data-followers>0</strong><span class="muted small">followers</span></div>
          <div><strong data-following>0</strong><span class="muted small">following</span></div>
          <div><strong data-clips>0</strong><span class="muted small">clips</span></div>
        </div>
        <h3 class="section-title">Your clips</h3>
        <div class="feed" data-my-feed>
          <div class="muted small">Loading…</div>
        </div>
        <button class="btn btn-ghost btn-sm" data-logout>Sign out</button>
      </section>
    </template>

    <template id="detail-view">
      <section class="view">
        <button class="link-back" data-back>← Back to feed</button>
        <div class="detail-card" data-detail>
          <div class="muted small">Loading…</div>
        </div>
      </section>
    </template>

    <script src="sidepanel.js"></script>
  </body>
</html>
