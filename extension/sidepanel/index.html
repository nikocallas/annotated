<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Annotated</title>
    <link rel="icon" type="image/svg+xml" href="../public/icons/favicon.svg" />
    <link rel="stylesheet" href="sidepanel.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-row">
        <a class="brand" href="https://annotatedextension.com" target="_blank" rel="noopener noreferrer" aria-label="Annotated home">
          <span class="brand-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M9 8.5c-2.6 1.4-4.4 3.9-4.4 7.5v8h7v-8H7.6c0-2.4 1.1-4.1 3.1-5.2L9 8.5zM21 8.5c-2.6 1.4-4.4 3.9-4.4 7.5v8h7v-8h-4c0-2.4 1.1-4.1 3.1-5.2L21 8.5z"
                fill="currentColor"
              />
            </svg>
          </span>
          <span class="brand-name">Annotated</span>
        </a>
        <button
          type="button"
          class="theme-toggle"
          data-theme-toggle
          aria-label="Toggle dark mode"
          title="Toggle dark mode"
        >
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
      <nav class="tabs">
        <button class="tab active" data-tab="clip">Clip</button>
        <button class="tab" data-tab="feed">Feed</button>
        <button class="tab" data-tab="profile">Profile</button>
      </nav>
    </header>

    <main id="content"></main>

    <template id="login-view">
      <section class="view view-login">
        <div class="hero">
          <h2>Sign in to start clipping</h2>
          <p class="muted">
            Annotated uses X or Google to sign you in. No email, no password.
          </p>
        </div>
        <div class="auth-buttons">
          <button class="btn btn-primary" data-provider="x">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M18.244 2H21l-6.523 7.45L22 22h-6.828l-4.74-6.184L4.8 22H2.043l6.978-7.97L2 2h6.914l4.286 5.668L18.244 2z"/></svg>
            Continue with X
          </button>
          <button class="btn btn-outline" data-provider="google">
            <svg viewBox="0 0 24 24" width="14" height="14"><path fill="#FFC107" d="M21.8 10H12v4h5.65A6 6 0 1 1 12 6c1.5 0 2.86.55 3.92 1.46l2.83-2.83A10 10 0 1 0 22 12c0-.67-.07-1.35-.2-2z"/></svg>
            Continue with Google
          </button>
        </div>
        <p class="hint">
          Trouble signing in?
          <a href="#" data-open-web-signin>Open sign-in on annotatedextension.com</a>
          and return here once you're authenticated.
        </p>
      </section>
    </template>

    <template id="clip-view">
      <section class="view">
        <div class="page-card" data-page-card>
          <div class="page-card-meta">
            <span class="badge" data-badge>Detecting…</span>
            <span class="muted small" data-host></span>
            <button class="link-mini" type="button" data-refresh-tab title="Re-detect current tab">↻</button>
          </div>
          <div class="page-card-title" data-title>Open Annotated on a tab to detect a source</div>
          <div class="page-card-author muted small" data-author></div>
          <a class="source-link" data-source-link target="_blank" rel="noopener noreferrer">View source ↗</a>
        </div>

        <details class="manual-url" data-manual-source>
          <summary>Use a different URL</summary>
          <input type="url" data-source-url placeholder="https://example.com/article-or-video" />
          <input type="text" data-manual-title placeholder="Title (optional)" />
        </details>

        <div class="clip-section" data-clip-section>
          <!-- Clip-type-specific UI injected here -->
        </div>

        <div class="commentary-section">
          <label class="label">Your commentary</label>
          <textarea data-commentary placeholder="Why does this matter?" rows="3"></textarea>

          <div class="recorder" data-recorder>
            <div class="recorder-row">
              <button class="btn btn-ghost btn-sm" type="button" data-record-toggle>
                <span class="dot" data-record-dot aria-hidden="true"></span>
                <span data-record-label>Record audio commentary</span>
              </button>
              <span data-record-time class="muted small mono">0:00 / 1:30</span>
            </div>
            <audio data-audio-preview controls hidden></audio>
            <div class="recorder-actions" data-recorder-actions hidden>
              <button class="btn btn-ghost btn-sm" type="button" data-record-discard>Discard</button>
              <span class="muted small" data-record-attached>Audio attached to publish ✓</span>
            </div>
            <div class="recorder-error" data-record-error hidden>
              <strong>Microphone access blocked.</strong>
              <span data-record-error-msg></span>
              <p class="muted small">
                Click the lock icon next to the URL bar in any tab and set
                Microphone to Allow for the Annotated extension, or visit
                <code>chrome://settings/content/microphone</code>.
              </p>
              <div class="recorder-error-actions">
                <button class="btn btn-outline btn-sm" type="button" data-record-open-settings>Open mic settings</button>
                <button class="btn btn-ghost btn-sm" type="button" data-record-retry>Try again</button>
              </div>
            </div>
          </div>
        </div>

        <div data-preview-mount></div>

        <div class="actions">
          <button class="btn btn-primary btn-lg" data-publish>Publish annotation</button>
        </div>
        <p class="hint" data-error hidden></p>
        <p class="hint">
          Clips capped at 90s. YouTube downscaled to 240p server-side. Source
          URL is always linked.
        </p>
      </section>
    </template>

    <template id="feed-view">
      <section class="view">
        <h3 class="section-title">Recent annotations</h3>
        <div class="feed" data-feed>
          <div class="muted small">Loading…</div>
        </div>
      </section>
    </template>

    <template id="profile-view">
      <section class="view">
        <div class="profile-header">
          <img class="avatar lg" data-avatar />
          <div>
            <div class="profile-name" data-display-name></div>
            <div class="muted small" data-username></div>
          </div>
        </div>
        <p class="bio" data-bio></p>
        <div class="profile-stats">
          <div><strong data-followers>0</strong><span class="muted small">followers</span></div>
          <div><strong data-following>0</strong><span class="muted small">following</span></div>
          <div><strong data-clips>0</strong><span class="muted small">clips</span></div>
        </div>
        <h3 class="section-title">Your clips</h3>
        <div class="feed" data-my-feed>
          <div class="muted small">Loading…</div>
        </div>
        <button class="btn btn-ghost btn-sm" data-logout>Sign out</button>
      </section>
    </template>

    <template id="detail-view">
      <section class="view">
        <button class="link-back" data-back>← Back to feed</button>
        <div class="detail-card" data-detail>
          <div class="muted small">Loading…</div>
        </div>
      </section>
    </template>

    <script src="sidepanel.js"></script>
  </body>
</html>
