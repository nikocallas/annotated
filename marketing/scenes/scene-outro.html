<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="_demo.css" />
<style>
  body { background: #F7F6F2; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 26px; }
  .glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(231,111,44,0.16), transparent 60%); pointer-events: none;
    opacity: 0; animation: fadeIn 1.0s ease 0.1s forwards; }
  .mark { width: 64px; height: 64px; border-radius: 16px;
    background: linear-gradient(135deg, #F89240, #E76F2C);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 18px 50px -12px rgba(231,111,44,.55);
    opacity: 0; transform: translateY(8px);
    animation: fadeUp 0.5s ease 0.25s forwards;
    z-index: 1; }
  .mark svg { width: 36px; height: 36px; fill: #fff; }
  .lead { font-size: 46px; font-weight: 800; letter-spacing: -0.025em; color: #28251D; line-height: 1.05; text-align: center;
    opacity: 0; transform: translateY(8px);
    animation: fadeUp 0.55s ease 0.6s forwards;
    z-index: 1; max-width: 900px; }
  .lead .accent { color: #E76F2C; }
  .cta {
    margin-top: 6px;
    background: linear-gradient(135deg, #F89240, #E76F2C);
    color: #fff; padding: 14px 26px; border-radius: 12px;
    font-size: 16px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 10px;
    box-shadow: 0 14px 36px -12px rgba(231,111,44,.55);
    opacity: 0; transform: translateY(8px);
    animation: fadeUp 0.55s ease 1.2s forwards;
    z-index: 1;
  }
  .cta .arrow { transition: transform 0.2s ease; display: inline-block; }
  .url {
    font-size: 14px; color: #5A5447;
    opacity: 0; animation: fadeIn 0.5s ease 1.6s forwards;
    z-index: 1;
  }
  .url b { color: #28251D; font-weight: 600; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="mark"><svg viewBox="0 0 32 32"><path d="M9 8.5c-2.6 1.4-4.4 3.9-4.4 7.5v8h7v-8H7.6c0-2.4 1.1-4.1 3.1-5.2L9 8.5zM21 8.5c-2.6 1.4-4.4 3.9-4.4 7.5v8h7v-8h-4c0-2.4 1.1-4.1 3.1-5.2L21 8.5z"/></svg></div>
<div class="lead">Always linked back to <span class="accent">the source.</span></div>
<div class="cta">Add Annotated to Chrome <span class="arrow">→</span></div>
<div class="url"><b>annotatedextension.com</b></div>
</body>
</html>
