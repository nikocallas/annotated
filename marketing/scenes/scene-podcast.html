<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="_demo.css" />
<style>
  /* Smaller selection range for the podcast clip (60s of a long episode) */
  .sp-track .sel { animation: extendSelP 1.4s cubic-bezier(0.4, 0, 0.2, 1) 2.0s forwards; }
  .sp-track .h2 { animation: moveH2P 1.4s cubic-bezier(0.4, 0, 0.2, 1) 2.0s forwards; }
  @keyframes extendSelP { to { width: 8%; } }
  @keyframes moveH2P { to { left: 30%; } }
</style>
</head>
<body>
<div class="scene">
  <img class="bg" src="../captures/podcast.png" alt="" />
  <aside class="panel">
    <div class="sp-top">
      <span class="sp-mark"><svg viewBox="0 0 32 32"><path d="M9 8.5c-2.6 1.4-4.4 3.9-4.4 7.5v8h7v-8H7.6c0-2.4 1.1-4.1 3.1-5.2L9 8.5zM21 8.5c-2.6 1.4-4.4 3.9-4.4 7.5v8h7v-8h-4c0-2.4 1.1-4.1 3.1-5.2L21 8.5z"/></svg></span>
      <span class="sp-name">Annotated</span>
    </div>
    <div class="sp-tabs">
      <div class="sp-tab active">Clip</div><div class="sp-tab">Feed</div><div class="sp-tab">Profile</div>
    </div>
    <div class="sp-body">
      <div class="sp-card">
        <div class="sp-source-from">From All-In Podcast</div>
        <div class="sp-source-title">All-In's 2026 Predictions</div>
        <div class="sp-source-host">open.spotify.com · Chamath, Jason, Sacks &amp; Friedberg</div>
      </div>
      <div class="sp-section">
        <div class="sp-section-label">Clip range</div>
        <div class="sp-range">
          <div class="col"><label>Start</label><input id="start-input" value="20:40" /></div>
          <div class="col"><label>End</label><input id="end-input" value="20:50" /></div>
        </div>
        <div class="sp-track"><span class="sel"></span><span class="h1"></span><span class="h2"></span></div>
        <div class="sp-dur" id="dur-label">10s · max 90s</div>
      </div>
      <div class="sp-section">
        <div class="sp-section-label">Your annotation</div>
        <div class="sp-textarea" id="commentary"></div>
      </div>
      <div class="sp-publish">
        <div class="sp-cap">Always linked back to the source.</div>
        <button class="sp-btn pulse">Publish</button>
      </div>
    </div>
  </aside>
</div>
<script>
  const fmt = (s) => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  const startSec = 20*60 + 40;
  const targetEnd = 21*60 + 44;
  const endInput = document.getElementById('end-input');
  const durLabel = document.getElementById('dur-label');
  let cur = 20*60 + 50;
  function tick() {
    cur += 6;
    if (cur >= targetEnd) { cur = targetEnd; }
    endInput.value = fmt(cur);
    durLabel.textContent = `${cur - startSec}s · max 90s`;
    if (cur < targetEnd) setTimeout(tick, 60);
  }
  setTimeout(tick, 2050);

  const text = "On capital allocation discipline. Worth queuing for the team — 'buying the dip on conviction, not on thesis.'";
  const commentary = document.getElementById('commentary');
  function typeCommentary() {
    let i = 0;
    const id = setInterval(() => {
      i += 1;
      commentary.textContent = text.slice(0, i);
      if (i >= text.length) clearInterval(id);
    }, 24);
  }
  setTimeout(typeCommentary, 4000);
</script>
</body>
</html>
