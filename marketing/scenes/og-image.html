<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    background: #F7F6F2; color: #28251D;
    font-family: Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 1100px; height: 1100px;
    background: radial-gradient(circle, rgba(231,111,44,0.18), transparent 60%);
    pointer-events: none;
  }
  .mark {
    position: relative;
    width: 110px; height: 110px;
    border-radius: 24px;
    background: linear-gradient(135deg, #F89240, #E76F2C);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 26px 70px -18px rgba(231,111,44,.55);
    margin-bottom: 18px;
  }
  .mark svg { width: 64px; height: 64px; fill: #fff; }
  .hero {
    position: relative;
    margin: 0;
    text-align: center;
    line-height: 0.9;
    letter-spacing: -0.04em;
    font-weight: 800;
  }
  .hero .word {
    display: block;
    font-size: 220px;
  }
  .hero .accent {
    background: linear-gradient(135deg, #F89240, #E76F2C);
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
  }
  .url {
    position: absolute;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 18px;
    font-weight: 500;
    color: #5A5447;
    letter-spacing: 0.02em;
  }
  .url b { color: #28251D; font-weight: 600; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="mark">
  <svg viewBox="0 0 32 32"><path d="M9 8.5c-2.6 1.4-4.4 3.9-4.4 7.5v8h7v-8H7.6c0-2.4 1.1-4.1 3.1-5.2L9 8.5zM21 8.5c-2.6 1.4-4.4 3.9-4.4 7.5v8h7v-8h-4c0-2.4 1.1-4.1 3.1-5.2L21 8.5z"/></svg>
</div>
<h1 class="hero">
  <span class="word">Clip.</span>
  <span class="word accent">Annotate.</span>
</h1>
<div class="url"><b>annotatedextension.com</b></div>
</body>
</html>
