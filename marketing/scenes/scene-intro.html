<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="_demo.css" />
<style>
  body { background: #F7F6F2; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 28px; }
  .glow {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(231,111,44,0.18), transparent 60%);
    pointer-events: none;
    opacity: 0; animation: fadeIn 1.2s ease 0.2s forwards;
  }
  .mark {
    width: 96px; height: 96px; border-radius: 22px;
    background: linear-gradient(135deg, #F89240, #E76F2C);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 30px 80px -20px rgba(231,111,44,.55);
    transform: scale(0.7); opacity: 0;
    animation: pop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.35s both;
    z-index: 1;
  }
  .mark svg { width: 56px; height: 56px; fill: #fff; }
  .text {
    font-size: 84px; font-weight: 800; letter-spacing: -0.035em; color: #28251D;
    line-height: 0.95; text-align: center;
    opacity: 0; transform: translateY(8px);
    animation: fadeUp 0.55s ease 1.05s both;
    z-index: 1;
  }
  .text .accent { color: #E76F2C; }
  .sub {
    font-size: 19px; color: #5A5447;
    opacity: 0; animation: fadeIn 0.5s ease 1.5s forwards;
    z-index: 1;
  }
  @keyframes pop { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div class="glow"></div>
<div class="mark"><svg viewBox="0 0 32 32"><path d="M9 8.5c-2.6 1.4-4.4 3.9-4.4 7.5v8h7v-8H7.6c0-2.4 1.1-4.1 3.1-5.2L9 8.5zM21 8.5c-2.6 1.4-4.4 3.9-4.4 7.5v8h7v-8h-4c0-2.4 1.1-4.1 3.1-5.2L21 8.5z"/></svg></div>
<div class="text">Clip. <span class="accent">Annotate.</span></div>
<div class="sub">90-second highlights from any video, podcast, or article.</div>
</body>
</html>
