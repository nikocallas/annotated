name: CI

on:
  pull_request:
  push:
    branches: [master, resubmission-hardening]

permissions:
  contents: read

concurrency:
  group: annotated-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run validate:extension
      - run: npm run security:scan
      - run: npm audit --audit-level=high
